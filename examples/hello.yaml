name: hello-smolbench
description: Zero-key demo suite for first-time smolbench users.
providers:
  - id: mock
    model: mock-fast
prompts:
  - id: greeting
    input: Say hello in one short sentence.
    expect:
      contains: hello
  - id: tiny-reasoning
    input: What is 2 + 2? Answer with only the number.
    expect:
      equals: "4"
